<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- White background -->
  <rect width="1080" height="1080" fill="#FFFFFF"/>

  <!-- Big bold "SG" centered -->
  <text x="540" y="600"
        font-family="Arial Black, sans-serif"
        font-size="500"
        font-weight="900"
        fill="#0F172A"
        text-anchor="middle"
        letter-spacing="-30">SG</text>

  <!-- Thin German flag bar under the letters -->
  <rect x="340" y="670" width="133" height="14" fill="#000000"/>
  <rect x="473" y="670" width="134" height="14" fill="#DD0000"/>
  <rect x="607" y="670" width="133" height="14" fill="#FFCE00"/>

  <!-- Subtitle -->
  <text x="540" y="780"
        font-family="Arial, sans-serif"
        font-size="44"
        font-weight="700"
        fill="#0F172A"
        text-anchor="middle"
        letter-spacing="8">STUDY IN GERMANY</text>
</svg>
