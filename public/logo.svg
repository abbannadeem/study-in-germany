<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>

  <!-- Gold decorative outer ring -->
  <circle cx="540" cy="540" r="470" fill="none" stroke="#FFCE00" stroke-width="4"/>
  <circle cx="540" cy="540" r="455" fill="none" stroke="#FFCE00" stroke-width="1" opacity="0.5"/>

  <!-- Curved top text "STUDY IN GERMANY" -->
  <defs>
    <path id="topArc" d="M 165,540 A 375,375 0 0 1 915,540" fill="none"/>
  </defs>
  <text font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#FFCE00" letter-spacing="12">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">STUDY IN GERMANY</textPath>
  </text>

  <!-- Center monogram "SG" -->
  <text x="540" y="640"
        font-family="Georgia, serif"
        font-size="440"
        font-weight="900"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="-20">SG</text>

  <!-- Decorative line -->
  <line x1="380" y1="720" x2="700" y2="720" stroke="#FFCE00" stroke-width="2"/>

  <!-- German flag mini bars (bottom) -->
  <g transform="translate(540, 800)">
    <rect x="-90" y="0" width="60" height="8" fill="#FFFFFF"/>
    <rect x="-25" y="0" width="50" height="8" fill="#DD0000"/>
    <rect x="30" y="0" width="60" height="8" fill="#FFCE00"/>
  </g>

  <!-- Bottom subtitle -->
  <text x="540" y="870"
        font-family="Arial, sans-serif"
        font-size="36"
        font-weight="400"
        fill="#94A3B8"
        text-anchor="middle"
        letter-spacing="20">— GUIDE —</text>
</svg>
