<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- White background -->
  <rect width="1080" height="1080" fill="#FFFFFF"/>

  <!-- German flag — 3 vertical stripes, rounded outer corners (matches site header) -->
  <g transform="translate(320, 320)">
    <!-- Clip mask for rounded rectangle -->
    <defs>
      <clipPath id="roundedFlag">
        <rect x="0" y="0" width="440" height="440" rx="50" ry="50"/>
      </clipPath>
    </defs>
    <g clip-path="url(#roundedFlag)">
      <rect x="0"   y="0" width="147" height="440" fill="#000000"/>
      <rect x="147" y="0" width="146" height="440" fill="#DD0000"/>
      <rect x="293" y="0" width="147" height="440" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Bottom text — matches site header style -->
  <text x="540" y="900"
        font-family="Arial Black, sans-serif"
        font-size="76"
        font-weight="900"
        fill="#0F172A"
        text-anchor="middle">Study in <tspan fill="#F59E0B">Germany</tspan></text>

  <!-- Tiny subtitle -->
  <text x="540" y="970"
        font-family="Arial, sans-serif"
        font-size="36"
        font-weight="500"
        fill="#64748B"
        text-anchor="middle"
        letter-spacing="14">GUIDE</text>
</svg>
