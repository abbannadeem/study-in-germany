<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#FFFFFF"/>

  <!-- German flag stripe (top accent) -->
  <rect x="0" y="0" width="1080" height="24" fill="#000000"/>
  <rect x="0" y="24" width="1080" height="24" fill="#DD0000"/>
  <rect x="0" y="48" width="1080" height="24" fill="#FFCE00"/>

  <!-- Outer rounded card -->
  <rect x="90" y="170" width="900" height="780" rx="60" ry="60" fill="#0F172A"/>

  <!-- Graduation cap icon -->
  <g transform="translate(540, 330)">
    <!-- Cap top (diamond) -->
    <polygon points="0,-90 180,0 0,90 -180,0" fill="#FFCE00"/>
    <polygon points="0,-90 180,0 0,0" fill="#FFD933"/>
    <!-- Cap bottom -->
    <rect x="-110" y="0" width="220" height="50" rx="10" fill="#DD0000"/>
    <!-- Tassel -->
    <line x1="0" y1="0" x2="0" y2="80" stroke="#FFCE00" stroke-width="8"/>
    <circle cx="0" cy="90" r="14" fill="#FFCE00"/>
  </g>

  <!-- "SG" main letters -->
  <text x="540" y="700"
        font-family="Arial Black, sans-serif"
        font-size="280"
        font-weight="900"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="-10">SG</text>

  <!-- Subtitle -->
  <text x="540" y="800"
        font-family="Arial, sans-serif"
        font-size="42"
        font-weight="700"
        fill="#FFCE00"
        text-anchor="middle"
        letter-spacing="6">STUDY IN GERMANY</text>

  <text x="540" y="850"
        font-family="Arial, sans-serif"
        font-size="32"
        font-weight="400"
        fill="#94A3B8"
        text-anchor="middle"
        letter-spacing="8">GUIDE</text>

  <!-- Bottom German flag stripe -->
  <rect x="0" y="984" width="1080" height="32" fill="#000000"/>
  <rect x="0" y="1016" width="1080" height="32" fill="#DD0000"/>
  <rect x="0" y="1048" width="1080" height="32" fill="#FFCE00"/>
</svg>
