<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Clean white background -->
  <rect width="1080" height="1080" fill="#FFFFFF"/>

  <!-- Subtle grid pattern (modern touch) -->
  <g opacity="0.04">
    <line x1="0" y1="200" x2="1080" y2="200" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="400" x2="1080" y2="400" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="600" x2="1080" y2="600" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="800" x2="1080" y2="800" stroke="#000000" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="1080" stroke="#000000" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="1080" stroke="#000000" stroke-width="1"/>
    <line x1="880" y1="0" x2="880" y2="1080" stroke="#000000" stroke-width="1"/>
  </g>

  <!-- German flag ribbon top-left -->
  <g transform="rotate(-15 0 50)">
    <rect x="-50" y="40" width="500" height="35" fill="#000000"/>
    <rect x="-50" y="75" width="500" height="35" fill="#DD0000"/>
    <rect x="-50" y="110" width="500" height="35" fill="#FFCE00"/>
  </g>

  <!-- Small red "STUDY IN" -->
  <text x="80" y="320" font-family="Arial Black, sans-serif" font-size="60" font-weight="900" fill="#DD0000" letter-spacing="2">STUDY IN</text>

  <!-- HUGE black "GERMANY" -->
  <text x="80" y="490" font-family="Arial Black, sans-serif" font-size="180" font-weight="900" fill="#0F172A" letter-spacing="-8">GERMANY</text>

  <!-- Yellow underline accent -->
  <rect x="80" y="510" width="500" height="14" fill="#FFCE00"/>

  <!-- Tagline -->
  <text x="80" y="600" font-family="Arial, sans-serif" font-size="34" font-weight="500" fill="#475569">Your complete guide — made simple</text>

  <!-- Feature list — red checkmarks -->
  <g transform="translate(80, 700)">
    <!-- Item 1 -->
    <circle cx="25" cy="0" r="22" fill="#DD0000"/>
    <text x="25" y="10" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="75" y="10" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0F172A">Top public universities</text>

    <!-- Item 2 -->
    <circle cx="25" cy="65" r="22" fill="#DD0000"/>
    <text x="25" y="75" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="75" y="75" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0F172A">Cost calculator</text>

    <!-- Item 3 -->
    <circle cx="25" cy="130" r="22" fill="#DD0000"/>
    <text x="25" y="140" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="75" y="140" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0F172A">Step-by-step visa guide</text>

    <!-- Item 4 -->
    <circle cx="25" cy="195" r="22" fill="#DD0000"/>
    <text x="25" y="205" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="75" y="205" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0F172A">Scholarships &amp; programs</text>
  </g>

  <!-- CTA bottom -->
  <rect x="80" y="980" width="920" height="70" rx="12" fill="#0F172A"/>
  <text x="540" y="1027" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">studyingermanyguide.com</text>

  <!-- Decorative German flag stripe bottom-right -->
  <g transform="rotate(15 1080 1080)">
    <rect x="700" y="950" width="500" height="25" fill="#000000"/>
    <rect x="700" y="975" width="500" height="25" fill="#DD0000"/>
    <rect x="700" y="1000" width="500" height="25" fill="#FFCE00"/>
  </g>
</svg>
