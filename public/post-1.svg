<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="50%" stop-color="#FFE5B4"/>
      <stop offset="100%" stop-color="#FFD89B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Warm gradient background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>

  <!-- Decorative circles for warmth -->
  <circle cx="100" cy="100" r="180" fill="#FFCE00" opacity="0.15"/>
  <circle cx="980" cy="980" r="200" fill="#F59E0B" opacity="0.15"/>
  <circle cx="950" cy="150" r="80" fill="#DC2626" opacity="0.1"/>

  <!-- Friendly emoji header -->
  <text x="540" y="180" font-size="120" text-anchor="middle">🎓</text>

  <!-- Eyebrow -->
  <text x="540" y="240" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#92400E" text-anchor="middle" letter-spacing="6">YOUR JOURNEY STARTS HERE</text>

  <!-- Main headline -->
  <text x="540" y="340" font-family="Arial Black, sans-serif" font-size="78" font-weight="900" fill="#1F2937" text-anchor="middle">Study in</text>
  <text x="540" y="430" font-family="Arial Black, sans-serif" font-size="78" font-weight="900" fill="#EA580C" text-anchor="middle">Germany 🇩🇪</text>

  <!-- Subheadline -->
  <text x="540" y="500" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#4B5563" text-anchor="middle">Made simple — by students, for students</text>

  <!-- White card with features -->
  <rect x="100" y="570" width="880" height="360" rx="40" fill="#FFFFFF" stroke="#FFCE00" stroke-width="3"/>

  <text x="160" y="660" font-size="44">✨</text>
  <text x="240" y="658" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#1F2937">183 public universities</text>

  <text x="160" y="730" font-size="44">💰</text>
  <text x="240" y="728" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#1F2937">Cost calculator</text>

  <text x="160" y="800" font-size="44">📋</text>
  <text x="240" y="798" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#1F2937">Step-by-step visa guide</text>

  <text x="160" y="870" font-size="44">🎯</text>
  <text x="240" y="868" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#1F2937">Scholarships &amp; programs</text>

  <!-- CTA button-like -->
  <rect x="270" y="970" width="540" height="80" rx="40" fill="url(#accentGrad)"/>
  <text x="540" y="1022" font-family="Arial Black, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">studyingermanyguide.com</text>
</svg>
